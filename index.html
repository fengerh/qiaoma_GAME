};

// 筒子：双环铜钱 + 白色菱形方孔（isRed 时铜钱变红，用于特定点）
function coin(cx, cy, r, isRed = false) {
    const col = isRed ? '#c0392b' : '#1769aa';
    const sw = Math.max(1.5, r * 0.18);   // 环的线宽
    const r2 = r * 0.55;                  // 内环半径
    const sq = r * 0.32;                  // 菱形方孔半边长
    const pts = `${cx},${cy-sq} ${cx+sq},${cy} ${cx},${cy+sq} ${cx-sq},${cy}`;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw.toFixed(1)}"/>`
         + `<circle cx="${cx}" cy="${cy}" r="${r2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${sw.toFixed(1)}"/>`
         + `<polygon points="${pts}" fill="#ffffff" stroke="${col}" stroke-width="${sw.toFixed(1)}"/>`;
}
// 条子：细竹竿 + 竹节（五条中心那根为红色；angle 可让竹节斜向，用于八条的 W/M）
function bamboo(cx, cy, w, h, isRed = false, angle = 0) {
    const c  = isRed ? '#c0392b' : '#2e8b57';
    const dc = isRed ? '#8e2418' : '#1f6b42';
    let inner = `<rect x="${(cx-w/2).toFixed(1)}" y="${(cy-h/2).toFixed(1)}" width="${w}" height="${h}" rx="${(w/2).toFixed(1)}" fill="${c}"/>`;
    const n = h > 32 ? 3 : (h > 22 ? 2 : 1);
    for (let i = 1; i < n; i++) {
        const yy = (cy - h/2 + h*i/n).toFixed(1);
        inner += `<line x1="${(cx-w/2-1).toFixed(1)}" y1="${yy}" x2="${(cx+w/2+1).toFixed(1)}" y2="${yy}" stroke="${dc}" stroke-width="2.5" stroke-linecap="round"/>`;
    }
    return angle ? `<g transform="rotate(${angle} ${cx} ${cy})">${inner}</g>` : inner;
}
function wanSVG(v) {
    const c = '#c0392b';   // 「萬」字保持红色
    const num = '#1a1a1a'; // 数字（一~九）改为黑色
    const f = "'KaiTi','STKaiti','SimSun','Microsoft YaHei',serif";
    return `<text x="50" y="60" text-anchor="middle" font-size="48" font-family="${f}" font-weight="bold" fill="${num}">${NUM_CN[v]}</text>`
         + `<text x="50" y="116" text-anchor="middle" font-size="48" font-family="${f}" font-weight="bold" fill="${c}">萬</text>`;
}
function tongSVG(v) {
    const r = v === 1 ? 30 : 13;
    // 红色点规则：三筒中间、五筒中间、七筒下面四个、九筒横排中间一行
    const RED = {
        3: [1],                       // 中间点
        5: [2],                       // 中间点
        6: [2,3,4,5],                 // 下面四个
        7: [3,4,5,6],                 // 下面四个
        9: [3,4,5]                    // 横排中间一行
    };
    const reds = RED[v] || [];
    return TONG_LAYOUT[v].map(([x,y], i) => coin(x,y,r, reds.includes(i))).join('');
}
function tiaoBird() {
    return `<g fill="#2e8b57">`
         + `<ellipse cx="46" cy="84" rx="15" ry="34"/>`
         + `<circle cx="46" cy="44" r="13"/>`
         + `<path d="M58 40 L75 46 L58 52 Z"/>`
         + `</g>`
         + `<path d="M40 58 C 18 66, 16 102, 36 114 C 28 98, 30 76, 45 64 Z" fill="#c0392b"/>` // 红色翅膀
         + `<circle cx="42" cy="42" r="3.2" fill="#fff"/>`
         + `<circle cx="42" cy="42" r="1.6" fill="#143d26"/>`
         + `<path d="M40 114 L46 102 L52 114" stroke="#2e8b57" stroke-width="4" fill="none" stroke-linecap="round"/>`
         + `<path d="M30 80 q-9 6 0 16" stroke="#2e8b57" stroke-width="3" fill="none" stroke-linecap="round"/>`;
}
function tiaoSVG(v) {
    if (v === 1) return tiaoBird();
    const d = TIAO_DIM[v];
    // 每条竹节的斜向角度（度，顺时针为正）；缺省为 0（竖直）
    const ANGLE = {
        8: [0, 45, -45, 0, 0, -45, 45, 0] // 八条：上[0,40,-40,0] 下[0,-40,40,0]
    };
    const angles = ANGLE[v] || [];
    return TIAO_LAYOUT[v].map(([x,y], i) => {
        // 红色规则：五条中心、七条竖向中间三个（中心列）、九条竖向中间三个（中心列）
        const isRed = (v === 5 && i === 2)
                    || (v === 7 && (i === 0 || i === 2 || i === 5))
                    || (v === 9 && (i === 1 || i === 4 || i === 7));
        return bamboo(x, y, d.w, d.h, isRed, angles[i] || 0);
    }).join('');
}
// 字牌：东/南/西/北（深色）
function fengSVG(v) {
    const name = HONOR_NAMES[v] || '';
    const f = "'KaiTi','STKaiti','SimSun','Microsoft YaHei',serif";
    return `<text x="50" y="94" text-anchor="middle" font-size="70" font-family="${f}" font-weight="bold" fill="#1a1a1a">${name}</text>`;
}

// 花牌：春夏秋冬(绿/红/金/蓝)、梅兰竹菊(红/绿/蓝/金)、中(红)發(绿)白(双蓝框)
function flowerSVG(v) {
    const name = FLOWER_NAMES[v] || '';
    const colors = { 1:'#2e8b57', 2:'#c0392b', 3:'#c98a00', 4:'#1769aa', 5:'#c0392b', 6:'#2e8b57', 7:'#1769aa', 8:'#c98a00', 9:'#c0392b', 10:'#2e8b57', 11:'#1769aa' };
    const c = colors[v] || '#333';
    const f = "'KaiTi','STKaiti','SimSun','Microsoft YaHei',serif";
    // 白：双层蓝框（无字、无点）
    if (v === 11) {
        return `<rect x="16" y="22" width="68" height="96" rx="6" fill="none" stroke="${c}" stroke-width="5"/>`
             + `<rect x="28" y="35" width="44" height="70" rx="4" fill="none" stroke="${c}" stroke-width="5"/>`;
    }
    // 中 / 發：无点，大字撑满牌面
    if (v === 9) {
        return `<text x="50" y="104" text-anchor="middle" font-size="96" font-family="${f}" font-weight="bold" fill="${c}">中</text>`;
    }
    if (v === 10) {
        return `<text x="50" y="102" text-anchor="middle" font-size="84" font-family="${f}" font-weight="bold" fill="${c}">發</text>`;
    }
    // 春夏秋冬 / 梅兰竹菊：保留原样式（圆点 + 大字）
    return `<circle cx="50" cy="36" r="9" fill="${c}" opacity="0.85"/>`
         + `<text x="50" y="108" text-anchor="middle" font-size="58" font-family="${f}" font-weight="bold" fill="${c}">${name}</text>`;
}

function tileSVG(tile) {
    let inner;
    if (tile.suit === 'feng') inner = fengSVG(tile.value);
    else if (tile.suit === 'flower') inner = flowerSVG(tile.value);
    else if (tile.suit === 'wan') inner = wanSVG(tile.value);
    else if (tile.suit === 'tong') inner = tongSVG(tile.value);
    else inner = tiaoSVG(tile.value);
    return `<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
}

// ==================== 游戏主控制器 ====================
class MahjongGame {
    constructor() {
        this.players = [];
        this.wall = [];
        this.currentPlayer = 0;
        this.phase = 'idle'; // idle, play, end
        this.lastDiscard = null;
        this.lastDiscardFrom = -1;
        this.history = this.loadHistory();
        this.totalScore = this.history.reduce((s, r) => s + r.scores[0], 0);
        this.huCount = 0;
        this.turnCount = 0;       // 已进行的摸牌轮数（用于海底捞月判定）
        this.lastRoundWinnerId = 0; // 上一局胡牌者，作为下一局庄家（未按则为本人）
        this.dealerId = 0;        // 本局庄家（开局玩家）
        this.timers = [];
        this.pending = null;
        this.selectedIndex = -1;  // 当前已抬起（待二次确认）的手牌下标，-1 表示无
        this.aiSpeed = 'normal';  // AI 出牌速度：slow/normal/fast/lightning
        this.aiLevel = 'normal';  // AI 难度：easy/normal/hard/master
        try {
            const saved = localStorage.getItem('qiaoma_ailevel');
            if (saved && ['easy', 'normal', 'hard', 'master'].includes(saved)) this.aiLevel = saved;
        } catch (e) { /* localStorage 不可用时不报错 */ }
        this.baseScore = 2; // 底分（默认2，设置可改）
        this.bloodBattle = false; // 胡到底（血战到底），默认关闭
        try {
            const bb = localStorage.getItem('qiaoma_bloodbattle');
            if (bb === '1') this.bloodBattle = true;
        } catch (e) { /* localStorage 不可用时不报错 */ }
        this.soundEnabled = true; // 语音播报默认开启
        this.init();
        this.showStartModal(); // 进入页面先弹设置，点「开始游戏」才发牌
    }

    // 统一管理定时器，避免「新游戏」后旧定时器操作新牌局
    schedule(fn, ms) {
        const id = setTimeout(() => {
            this.timers = this.timers.filter(t => t !== id);
            fn();
        }, ms);
        this.timers.push(id);
        return id;
    }

    clearTimers() {
        for (const id of this.timers) clearTimeout(id);
        this.timers = [];
    }

    // AI 思考延迟：按设置的速度档位随机，让玩家看清局势
    aiThinkDelay() {
        const map = {
            slow:      [3000, 2000], // 3~5 秒
            normal:    [1500, 1000], // 1.5~2.5 秒
            fast:      [600, 600],   // 0.6~1.2 秒
            lightning: [150, 200]    // 0.15~0.35 秒
        };
        const [min, range] = map[this.aiSpeed] || map.normal;
        return min + Math.floor(Math.random() * range);
    }

    // 当前 AI 难度参数（集中管理 4 档的「旋钮」）
    aiOpts() {
        return AI_LEVELS[this.aiLevel] || AI_LEVELS.normal;
    }

    // 语音播报（Web Speech API，仅动作词）
    speak(text) {
        if (!this.soundEnabled || !('speechSynthesis' in window)) return;
        try {
            window.speechSynthesis.cancel(); // 防止堆积，只播最新一句
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            u.rate = 1.15;
            if (!this._zhVoice) {
                const voices = window.speechSynthesis.getVoices();
                this._zhVoice = voices.find(v => (v.lang || '').toLowerCase().startsWith('zh')) || null;
                if (!this._zhVoice) {
                    window.speechSynthesis.onvoiceschanged = () => {
                        const vs = window.speechSynthesis.getVoices();
                        this._zhVoice = vs.find(v => (v.lang || '').toLowerCase().startsWith('zh')) || null;
                    };
                }
            }
            if (this._zhVoice) u.voice = this._zhVoice;
            window.speechSynthesis.speak(u);
        } catch (e) { /* 语音不可用时不报错 */ }
    }

    toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        const btn = document.getElementById('sound-toggle');
        if (btn) btn.textContent = this.soundEnabled ? '🔊 语音' : '🔇 静音';
    }

    // ==================== 历史记录（localStorage 持久化） ====================
    loadHistory() {
        try {
            const raw = localStorage.getItem('qiaoma_history');
            if (!raw) return [];
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
    }

    saveHistory() {
        try {
            localStorage.setItem('qiaoma_history', JSON.stringify(this.history));
        } catch (e) { /* 存储不可用时静默 */ }
    }


    init() {
        this.clearTimers();
        this.maxFan = this.maxFan || null; // 最高番数上限（null=不封顶，会话内保持）
        this.players = [
            new Player(0, true),
            new Player(1, false),
            new Player(2, false),
            new Player(3, false)
        ];
        this.wall = [];
        this.currentPlayer = 0;
        this.phase = 'idle';
        this.lastDiscard = null;
        this.lastDiscardFrom = -1;
        this.huCount = 0;
        this.turnCount = 0;
        this.pending = null;
        this.enableDiscard = false;
        this.drawnTile = null;
        this.render();
        // 刷新/重开后，将已从 localStorage 恢复的累计总分写回左上角显示
        document.getElementById('total-score').textContent = this.totalScore;
        this.updateGameTitle();
    }

    restart() {
        if (!confirm('确定开新局吗？当前牌局进度将丢失。')) return;
        this.init();
        this.start();
    }

    start() {
        this.updateGameTitle();
        this._resultSaved = false; // 新一局允许重新记录历史
        this._roundFirstWinner = null;
        this._lastHuPlayerId = null;
        // 庄家 = 上一局胡牌者（首局/无记录时为本人）
        this.dealerId = (this.lastRoundWinnerId !== undefined && this.lastRoundWinnerId !== null) ? this.lastRoundWinnerId : 0;
        this.turnCount = 0;
        // 洗牌
        this.wall = shuffle(createDeck());
        // 发牌：每人 13 张，遇花自动补花（从牌墙末尾补），保证手牌不含花牌
        for (const p of this.players) {
            p.hand = []; p.melds = []; p.discards = []; p.flowers = [];
            p.isHu = false; p.isTing = false; p.isKnocked = false; p.huInfo = null;
            p.gangScore = 0; p.gangCounts = { ming: 0, an: 0, bu: 0 }; p.score = 0;
            while (p.hand.length < 13) {
                const d = this.drawFromWall(p, true); // 发牌阶段补花静默
                if (!d.tile) break;                   // 牌墙已尽
                p.hand.push(d.tile);
            }
            p.sortHand();
        }
        this.phase = 'play';
        this.currentPlayer = this.dealerId;
        const dirEl = document.getElementById('direction-info');
        if (dirEl) dirEl.textContent = '上海敲麻 · 听牌后点「敲」报听才能胡';
        this.render();
        this.showToast('🀄 上海敲麻开局！庄家先摸牌');
        this.schedule(() => this.gameLoop(), 800);
    }

    // 摸牌 + 补花：正常摸牌取牌墙前端；杠后（fromBack）从牌墙末尾取；
    // 一旦摸到花牌即自动收入花区，并继续从牌墙「末尾」补牌，直到补到非花牌（或牌墙耗尽）。
    // 返回 { tile, flowered, fromBack }，tile 为最终入手牌的非花牌（可能为 null）。
    drawFromWall(player, silent = false, fromBack = false) {
        const flBefore = HuChecker.rawFlower(player); // 记录补花前花数（用于"捉冲"提示）
        if (this.wall.length === 0) return { tile: null, flowered: false, fromBack };
        let tile = fromBack ? this.wall.pop() : this.wall.shift();  // 杠后取末尾，正常取前端
        let flowered = false;
        while (tile && tile.type === 'flower') {
            player.flowers.push(tile);  // 花自动移出手牌 → 花区
            flowered = true;
            if (this.wall.length === 0) { tile = null; break; }
            tile = this.wall.pop();     // 补花恒从牌墙末尾
        }
        if (flowered && !silent) {
            this.speak('补花');
            this.showToast(`${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} 补花 +${player.flowers.length}花`);
        }
        // 花数跨过 3 花（点炮门槛）且已报听 → 现在可以胡点炮了（覆盖上一条 toast）
        if (!silent) {
            const flAfter = HuChecker.rawFlower(player);
            if (flBefore < 3 && flAfter >= 3 && player.isHuman && player.isKnocked) {
                this.showToast('已经可以捉冲了！');
            }
        }
        return { tile, flowered, fromBack };
    }

    // 回到开始界面（仅清局回空棋盘，不弹窗）
    toStartScreen() {
        this.init();
        document.getElementById('modal-container').innerHTML = '';
    }

    // 确认结算后回到牌桌：保留本局数据，亮出全部手牌
    backToTable() {
        document.getElementById('modal-container').innerHTML = '';
        this.render();
    }

    // ==================== 敲（报听）机制 ====================
    // 列出「打出后即成听牌（且有符合资格的胡牌张）」的手牌下标（同种牌去重）
    knockDiscardCandidates(player) {
        if (player.isKnocked || player.isHu) return [];
        if (player.hand.length % 3 !== 2) return []; // 需处于「可出牌」张数
        const res = [];
        const seen = new Set();
        const savedHand = player.hand;
        for (let i = 0; i < savedHand.length; i++) {
            const t = savedHand[i];
            if (seen.has(t.id)) continue;
            seen.add(t.id);
            player.hand = savedHand.filter((_, k) => k !== i); // 打出后 13 张
            if (HuChecker.knockable(player)) res.push(i);
            player.hand = savedHand;
        }
        return res;
    }

    // 是否可敲：未敲未胡，且当前手牌已听牌并存在「至少能自摸胡」的听牌张（2 花即可报听）
    canKnock(player) {
        if (player.isKnocked || player.isHu) return false;
        return HuChecker.knockable(player);
    }

    // 数字转中文（1~10），其余回退数字字符串（提示文案共用）
    cnNum(n) {
        const cn = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
        return (n >= 1 && n <= 10) ? cn[n] : String(n);
    }

    // 是否存在任一「听牌张」能点炮胡（false 表示只能自摸）
    canRonAnyTing(player) {
        const ting = HuChecker.tingTiles(player.hand, player.melds);
        if (!ting.length) return false;
        const savedK = player.isKnocked;
        player.isKnocked = true; // 临时置位，便于 canRon 判定
        let ok = false;
        for (const id of ting) {
            const [s, v] = id.split('_');
            if (HuChecker.canRon(player, new Tile(s, parseInt(v)), {})) { ok = true; break; }
        }
        player.isKnocked = savedK;
        return ok;
    }

    // 常驻状态行：一花听牌 → 无法报听；二花听牌（点炮不能胡）→ 需要自摸；其余不显示
    updateKnockStatus() {
        const el = document.getElementById('knock-status');
        if (!el) return;
        const me = this.players[0];
        let text = '';
        if (me && !me.isHu && HuChecker.tingTiles(me.hand, me.melds).length > 0 && !this.canRonAnyTing(me)) {
            const fl = HuChecker.rawFlower(me);
            if (fl === 1) text = '无法报听，目前一花';
            else if (fl === 2) text = `目前${this.cnNum(fl)}花，需要自摸`;
        }
        el.textContent = text;
    }

    // 执行「敲」（报听）：手牌锁定，只能摸什么打什么，允许暗杠/补杠
    doKnock(player) {
        player.isKnocked = true;
        player.isTing = true;
        this.render();
        this.speak('报听');
        this.showToast(`${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} 报听（敲）！`);
    }

    // ==================== 游戏主循环 ====================
    gameLoop() {
        if (this.phase !== 'play') return;
        this.selectedIndex = -1;
        this._awaitKnock = false;

        const player = this.players[this.currentPlayer];
        if (player.isHu) { this.nextPlayer(); this.gameLoop(); return; }

        // 血战到底：仅剩 1 家未胡时本局结束
        if (this.players.filter(p => !p.isHu).length <= 1) { this.endGame(); return; }

        // 牌墙为空 -> 流局
        if (this.wall.length === 0) { this.liuJu(); return; }

        // 摸牌 + 补花（杠后从牌堆末尾摸）
        this.turnCount++;
        const fromBack = !!this._drawFromBack;
        this._drawFromBack = false;
        const drawn = this.drawFromWall(player, false, fromBack);
        if (!drawn.tile) { this.liuJu(); return; }
        this.drawnTile = drawn.tile;
        player.addTile(drawn.tile);
        player.sortHand();
        this.render();

        // 杠开：本次为「杠后从牌尾摸牌」或「补花后摸到的牌」
        const gangKai = fromBack || drawn.flowered;
        this._curGangKai = gangKai; // 供人类自摸时使用

        // 暗杠 / 补杠 候选
        const angangTile = this.checkAnGang(player);

        // 自摸胡：须已敲 + 达到番/花门槛
        const huInfo = HuChecker.canTsumo(player, { gangKai });

        if (player.isHuman) {
            this.showHumanActions(huInfo, angangTile, drawn.tile);
        } else {
            const opts = this.aiOpts();
            this.schedule(() => {
                if (huInfo) { this.doHu(player, null, true, { gangKai }); return; }
                if (angangTile && AIPlayer.shouldGang(player, angangTile, opts, true, this)) {
                    this.doAnGang(player, angangTile);
                    return;
                }
                const bugangTile = this.checkBuGang(player);
                if (bugangTile) { this.doBuGang(player, bugangTile); return; }
                // 未敲且「打一张即听牌」→ 评估是否报听
                const cands = this.knockDiscardCandidates(player);
                if (cands.length && AIPlayer.shouldKnock(player, this, opts)) {
                    // 报听：先出牌（照常播牌名），再报听（播「报听」，后一句自然盖掉牌名）
                    let kIdx = cands.find(i => this.drawnTile && player.hand[i].id === this.drawnTile.id);
                    if (kIdx === undefined) kIdx = cands[0];
                    this.doDiscard(player, kIdx);
                    this.doKnock(player);
                    return;
                }
                // 已报听：只能摸打刚摸到的牌
                let idx;
                if (player.isKnocked && this.drawnTile) {
                    idx = player.hand.findIndex(t => t.id === this.drawnTile.id);
                }
                if (idx === undefined || idx < 0) idx = AIPlayer.chooseDiscard(player, opts, this);
                this.doDiscard(player, idx);
            }, this.aiThinkDelay());
        }
    }

    seatName(id) {
        return id === 0 ? '你' : ['', '东', '北', '西'][id] || ('家' + id);
    }

    showHumanActions(huInfo, angangTile, drawnTile) {
        const me = this.players[0];
        const buttons = [];
        if (huInfo) {
            buttons.push(`<button class="action-btn btn-hu" onclick="game.humanHu()">胡（自摸·${huInfo.fan}番）</button>`);
        }
        if (angangTile) {
            buttons.push(`<button class="action-btn btn-gang" onclick="game.humanAnGang()">杠(${angangTile.toString()}·自摸)</button>`);
        }
        const bugangTile = this.checkBuGang(me);
        if (bugangTile) {
            buttons.push(`<button class="action-btn btn-gang" onclick="game.humanBuGang()">补杠(${bugangTile.toString()}·自摸)</button>`);
        }
        if (buttons.length > 0) {
            buttons.push(`<button class="action-btn btn-pass" onclick="game.humanPass()">过</button>`);
        }

        document.getElementById('action-buttons').innerHTML = buttons.join('');
        document.getElementById('hint-text').textContent = me.isKnocked ? '已报听：只能打出刚摸到的牌' : '请选择操作或点击手牌出牌';

        this.enableDiscard = true;
        this.drawnTile = drawnTile;
    }

    humanHu() {
        this.selectedIndex = -1;
        document.getElementById('action-buttons').innerHTML = '';
        document.getElementById('hint-text').textContent = '';
        this.enableDiscard = false;
        this.doHu(this.players[0], null, true, { gangKai: !!this._curGangKai });
    }

    humanAnGang() {
        this.selectedIndex = -1;
        document.getElementById('action-buttons').innerHTML = '';
        const tile = this.checkAnGang(this.players[0]);
        this.doAnGang(this.players[0], tile);
    }

    humanBuGang() {
        this.selectedIndex = -1;
        document.getElementById('action-buttons').innerHTML = '';
        const tile = this.checkBuGang(this.players[0]);
        this.doBuGang(this.players[0], tile);
    }

    humanPass() {
        document.getElementById('action-buttons').innerHTML = '';
        this.enableDiscard = true;
        document.getElementById('hint-text').textContent = this.players[0].isKnocked ? '已报听：只能打出刚摸到的牌' : '请点击手牌出牌';
    }

    // 出牌（点击手牌）：两步确认
    onTileClick(idx) {
        if (this.phase !== 'play') return;
        if (this.currentPlayer !== 0) return;
        if (!this.enableDiscard) return;

        const player = this.players[0];

        // 已报听：只能打出刚摸到的牌（摸打），不能换牌
        if (player.isKnocked) {
            const t = player.hand[idx];
            if (!this.drawnTile || t.id !== this.drawnTile.id) {
                this.showToast('已报听，只能打出刚摸到的牌');
                return;
            }
        }

        if (this.selectedIndex !== idx) {
            this.selectedIndex = idx;
            this.render();
            document.getElementById('hint-text').textContent = '再次点击该牌确认出牌';
            return;
        }

        this.selectedIndex = -1;
        this.enableDiscard = false;
        this.drawnTile = null;
        document.getElementById('action-buttons').innerHTML = '';
        document.getElementById('hint-text').textContent = '';
        this.doDiscard(player, idx);
    }

    doDiscard(player, idx) {
        const tile = player.hand.splice(idx, 1)[0];
        player.discards.push(tile);
        player.sortHand();
        this.lastDiscard = tile;
        this.lastDiscardFrom = player.id;
        this.render();
        this.speak(tile.toString());

        // 出牌后：人类若恰好听牌 → 询问是否报听（不透露所听何牌），并暂缓他家响应
        if (player.isHuman && !player.isKnocked && this.canKnock(player)) {
            this._pendingDiscardTile = tile;
            this._pendingDiscardFrom = player.id;
            this.askKnock();
            return;
        }
        // 已听牌但达不到报听资格（典型：一花平胡）→ 说明原因，避免"看似能报却报不了"
        if (player.isHuman && !player.isKnocked && !player.isHu
            && HuChecker.tingTiles(player.hand, player.melds).length > 0) {
            const fl = HuChecker.rawFlower(player);
            this.showToast(fl === 1 ? '无法报听，目前一花' : `无法报听，目前${this.cnNum(fl)}花`);
        }
        // 检查其他玩家能否 胡/杠/碰/吃
        this.schedule(() => this.checkOtherActions(tile, player.id), 400);
    }

    // 出牌后询问是否报听（人类）；确认/跳过后再继续他家响应
    askKnock() {
        this._awaitKnock = true;
        this.enableDiscard = false;
        const me = this.players[0];
        let hint = '你已听牌，是否报听（敲）？';
        // 点炮不能胡（只能自摸，典型=二花平胡）→ 补注说明
        if (!this.canRonAnyTing(me)) {
            hint = `你已听牌，是否报听（敲）？（目前${this.cnNum(HuChecker.rawFlower(me))}花，需要自摸）`;
        }
        document.getElementById('action-buttons').innerHTML =
            `<button class="action-btn btn-qiao" onclick="game.confirmKnock()">敲（报听）</button>`
          + `<button class="action-btn btn-pass" onclick="game.skipKnock()">不报</button>`;
        document.getElementById('hint-text').textContent = hint;
    }

    confirmKnock() {
        if (!this._awaitKnock) return;
        this._awaitKnock = false;
        document.getElementById('action-buttons').innerHTML = '';
        document.getElementById('hint-text').textContent = '';
        this.doKnock(this.players[0]); // 报听
        this.schedule(() => this.checkOtherActions(this._pendingDiscardTile, this._pendingDiscardFrom), 200);
    }

    skipKnock() {
        if (!this._awaitKnock) return;
        this._awaitKnock = false;
        document.getElementById('action-buttons').innerHTML = '';
        document.getElementById('hint-text').textContent = '';
        this.schedule(() => this.checkOtherActions(this._pendingDiscardTile, this._pendingDiscardFrom), 200);
    }

    checkOtherActions(tile, fromId) {
        // 从出牌者下家开始扫描，收集 胡/杠/碰 候选；吃仅限下家（上家关系）
        const huPlayers = [];   // 元素：{ player, must }
        let gangPlayer = null;
        let pengPlayer = null;
        let chiPlayer = null;
        let chiCombos = null;

        for (let step = 1; step <= 3; step++) {
            const i = (fromId + step) % 4;
            const p = this.players[i];
            if (p.isHu) continue;

            // 点炮胡（须已敲 + 达到番/花门槛）；must = 花数≥3 必胡
            if (HuChecker.canRon(p, tile, {})) {
                huPlayers.push({ player: p, must: HuChecker.mustRon(p, tile, {}) });
            }

            // 已报听者不得碰/杠/吃（均会换牌破坏听牌型）；其暗杠/补杠在自己的摸牌回合处理
            if (!p.isKnocked) {
                const count = p.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
                if (!gangPlayer && count === 3) gangPlayer = p;
                if (!pengPlayer && count === 2) pengPlayer = p;
                // 吃：仅限出牌者的下家（step===1）
                if (step === 1 && !chiPlayer) {
                    const combos = ChiHelper.combos(p.hand, tile);
                    if (combos.length) { chiPlayer = p; chiCombos = combos; }
                }
            }
        }

        // 按优先级 胡 > 杠 > 碰 > 吃 解析
        this.pending = { tile, fromId, huPlayers, gangPlayer, pengPlayer, chiPlayer, chiCombos, huOccurred: false };
        this.resolvePending();
    }

    // 按优先级依次解析待处理候选
    resolvePending() {
        const pend = this.pending;
        if (!pend) { this.nextTurn(); return; }
        const { tile, fromId } = pend;

        // 胡（一炮多响：按座次逐个结算；人类用按钮选择胡/过；mustRon 不给过）
        if (pend.huPlayers && pend.huPlayers.length) {
            const entry = pend.huPlayers[0];
            const p = entry.player;
            if (p.isHuman) {
                this.showPengGangHuOptions(p, tile, 'hu', entry.must);
                return;
            }
            // AI 胡：出队并结算（advance=false），随后继续处理剩余可胡者
            pend.huPlayers.shift();
            pend.huOccurred = true;
            this.schedule(() => {
                this.doHu(p, tile, false, {}, false);
                this.resolvePending();
            }, 900);
            return;
        }

        if (pend.huOccurred) { pend.gangPlayer = null; pend.pengPlayer = null; pend.chiPlayer = null; }

        if (pend.gangPlayer) {
            const p = pend.gangPlayer;
            pend.gangPlayer = null;
            if (p.isHuman) {
                this.showPengGangHuOptions(p, tile, 'gang');
            } else if (AIPlayer.shouldGang(p, tile, this.aiOpts(), false, this)) {
                this.schedule(() => this.doMingGang(p, tile, fromId), 900);
            } else {
                this.resolvePending();
            }
            return;
        }

        if (pend.pengPlayer) {
            const p = pend.pengPlayer;
            pend.pengPlayer = null;
            if (p.isHuman) {
                this.showPengGangHuOptions(p, tile, 'peng');
            } else if (AIPlayer.shouldPeng(p, tile, this.aiOpts(), this)) {
                this.schedule(() => this.doPeng(p, tile, fromId), 900);
            } else {
                this.resolvePending();
            }
            return;
        }

        if (pend.chiPlayer) {
            const p = pend.chiPlayer;
            pend.chiPlayer = null;
            if (p.isHuman) {
                this.showPengGangHuOptions(p, tile, 'chi');
            } else {
                const combo = AIPlayer.shouldChi(p, tile, this.aiOpts(), this);
                if (combo) { this.schedule(() => this.doChi(p, tile, fromId, combo), 900); }
                else { this.resolvePending(); }
            }
            return;
        }

        // 所有动作结算完毕
        const hadHu = pend.huOccurred;
        this.pending = null;
        if (hadHu) { this.afterHu(); return; }  // 有人胡：由 afterHu 决定继续/结束
        this.nextTurn();
    }

    showPengGangHuOptions(player, tile, type, mustRon = false) {
        const fromNote = `（来自${this.seatName(this.lastDiscardFrom)}）`;
        const buttons = [];
        // 已报听（敲）者手牌锁定：不得碰/吃/明杠（会拆掉听牌导致卡死），只给「胡」与「过」
        const knocked = !!player.isKnocked;
        // 只有已报听（敲）者才能胡；未敲者即使牌型成立也不可胡（渲染层兜底）
        if (type === 'hu' && knocked) {
            buttons.push(`<button class="action-btn btn-hu" onclick="game.doHuFromDiscard(${player.id})">胡${fromNote}</button>`);
        }
        if (!knocked && (type === 'gang' || type === 'hu')) {
            const count = player.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
            if (count === 3) {
                buttons.push(`<button class="action-btn btn-gang" onclick="game.doMingGangFromUI(${player.id})">杠${fromNote}</button>`);
            }
        }
        if (!knocked && (type === 'peng' || type === 'gang' || type === 'hu')) {
            const count = player.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
            if (count >= 2) {
                buttons.push(`<button class="action-btn btn-peng" onclick="game.doPengFromUI(${player.id})">碰${fromNote}</button>`);
            }
        }
        if (!knocked && type === 'chi' && this.pending && this.pending.chiCombos) {
            this.pending.chiCombos.forEach((combo, k) => {
                const label = combo.map(t => t.toString()).join('');
                buttons.push(`<button class="action-btn btn-chi" onclick="game.doChiFromUI(${player.id}, ${k})">吃 ${label}</button>`);
            });
        }
        // 已报听（敲）者只能胡，不提供「过」；非报听者仍按"花数≥3 点炮必胡"不给「过」
        if (!knocked && !(type === 'hu' && mustRon)) {
            buttons.push(`<button class="action-btn btn-pass" onclick="game.passAction()">过</button>`);
        }

        document.getElementById('action-buttons').innerHTML = buttons.join('');
        this.pendingTile = tile;
        this.pendingPlayer = player;
    }

    doHuFromDiscard(pid) {
        document.getElementById('action-buttons').innerHTML = '';
        const p = this.players[pid];
        if (this.pending) {
            this.pending.huOccurred = true;
            this.pending.huPlayers = this.pending.huPlayers.filter(e => e.player !== p);
        }
        this.doHu(p, this.pendingTile, false, {}, false); // advance=false：由 resolvePending 统一推进
        this.resolvePending();
    }

    doMingGangFromUI(pid) {
        document.getElementById('action-buttons').innerHTML = '';
        if (this.pending) {
            this.pending.huPlayers = [];   // 杠吃掉该牌
            this.pending.pengPlayer = null;
            this.pending.chiPlayer = null;
        }
        this.doMingGang(this.players[pid], this.pendingTile, this.lastDiscardFrom);
    }

    doPengFromUI(pid) {
        document.getElementById('action-buttons').innerHTML = '';
        if (this.players[pid].isKnocked) return; // 报听者不得碰（双保险）
        if (this.pending) {
            this.pending.huPlayers = [];   // 碰吃掉该牌
            this.pending.gangPlayer = null;
            this.pending.chiPlayer = null;
        }
        this.doPeng(this.players[pid], this.pendingTile, this.lastDiscardFrom);
    }

    doChiFromUI(pid, k) {
        document.getElementById('action-buttons').innerHTML = '';
        if (this.players[pid].isKnocked) return; // 报听者不得吃（双保险）
        const combo = this.pending.chiCombos[k];
        if (this.pending) {
            this.pending.huPlayers = [];
            this.pending.gangPlayer = null;
            this.pending.pengPlayer = null;
        }
        this.doChi(this.players[pid], this.pendingTile, this.lastDiscardFrom, combo);
    }

    passAction() {
        document.getElementById('action-buttons').innerHTML = '';
        const p = this.pendingPlayer;
        if (this.pending && p) {
            if (this.pending.huPlayers) this.pending.huPlayers = this.pending.huPlayers.filter(e => e.player !== p);
            if (this.pending.gangPlayer === p) this.pending.gangPlayer = null;
            if (this.pending.pengPlayer === p) this.pending.pengPlayer = null;
            if (this.pending.chiPlayer === p) this.pending.chiPlayer = null;
        }
        this.resolvePending();
    }

    // ==================== 操作执行 ====================
    doHu(player, tile, isZiMo, ctx = {}, advance = true) {
        if (isZiMo) {
            // 自摸：牌已在手牌中，无需再加入
        } else {
            player.addTile(tile);
            const fromPlayer = this.players[this.lastDiscardFrom];
            if (fromPlayer && fromPlayer.discards.length) fromPlayer.discards.pop();
        }
        player.isHu = true;
        if (player.isHuman) {
            document.getElementById('action-buttons').innerHTML = '';
            document.getElementById('hint-text').textContent = '';
            this.enableDiscard = false;
        }
        this.huCount++;
        // 记录最后一个胡牌者（一铳二取第二个），用于决定由谁的下家继续摸打
        this._lastHuPlayerId = player.id;
        // 记录本局第一个胡牌者作为下一局庄家（血战取第一个，而非最后一个；流局则保持不变）
        if (this._roundFirstWinner === null || this._roundFirstWinner === undefined) {
            this._roundFirstWinner = player.id;
            this.lastRoundWinnerId = player.id;
        }

        const fanInfo = HuChecker.calcFan(player, tile, isZiMo, ctx);
        player.huInfo = fanInfo;
        player.huInfo.tile = tile || player.hand[player.hand.length - 1];
        player.huInfo.isZiMo = isZiMo;
        player.huInfo.fromId = isZiMo ? player.id : this.lastDiscardFrom;
        player.huInfo.isQiangGang = !!ctx.qiangGang;

        const huType = isZiMo ? '自摸' : (ctx.qiangGang ? '抢杠胡' : '点炮');
        this.showToast(`🎉 ${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} ${huType}！${fanInfo.fan}番 = ${fanInfo.fanList.join('+')}`);

        this.settleHu(player, fanInfo, isZiMo);
        this.render();
        this.speak('胡');
        // 一炮多响时 advance=false，由 resolvePending 逐个结算后统一推进；否则在此推进
        if (advance) {
            this.pending = null;
            this.afterHu();
        }
    }

    // 胡牌后的推进分派：血战到底继续摸打，否则（或已结束）本局结束
    afterHu() {
        const active = this.players.filter(p => !p.isHu);
        if (!this.bloodBattle) { this.schedule(() => this.endGame(), 2000); return; }
        if (active.length <= 1 || this.huCount >= 3) { this.schedule(() => this.endGame(), 2000); return; }
        // 由「最后一个胡牌者」的下家继续摸打（一铳二取第二个胡者；自摸者即胡者，同样适用）
        this.schedule(() => {
            if (this._lastHuPlayerId !== null && this._lastHuPlayerId !== undefined) {
                this.currentPlayer = this._lastHuPlayerId;
            }
            this.nextPlayer();   // 跳过已胡者，落在胡牌者的下家（或其后第一个未胡者）
            this.gameLoop();
        }, 2000);
    }

    settleHu(winner, fanInfo, isZiMo) {
        const cap = this.maxFan || Infinity;
        const fan = Math.min(fanInfo.fan, cap);
        // 计分 = 基数 × 番：基数 = 底分 + 有效花数（0花按10）
        const basePoint = this.baseScore || 2;
        const flower = HuChecker.effFlower(winner);
        const base = basePoint + flower;
        const pay = base * fan;
        winner.huInfo.basePoint = basePoint;
        winner.huInfo.flower = flower;
        winner.huInfo.base = base;
        winner.huInfo.pay = pay;
        if (isZiMo) {
            // 自摸：所有未胡玩家各付一份（血战中已胡者不付）
            for (const p of this.players) {
                if (p.id === winner.id || p.isHu) continue;
                p.score -= pay;
                winner.score += pay;
            }
        } else {
            // 点炮：放炮者付
            const loser = this.players[this.lastDiscardFrom];
            if (loser && loser.id !== winner.id) {
                loser.score -= pay;
                winner.score += pay;
            }
        }
    }

    doPeng(player, tile, fromId) {
        if (player.isKnocked) return; // 报听者手牌锁定，不得碰
        const pengCount = player.hand.filter(t => t.suit === tile.suit && t.value === tile.value).length;
        if (pengCount === 3) { this.doMingGang(player, tile, fromId); return; }
        let removed = 0;
        player.hand = player.hand.filter(t => {
            if (removed < 2 && t.suit === tile.suit && t.value === tile.value) { removed++; return false; }
            return true;
        });
        this.players[fromId].discards.pop();
        player.melds.push({ type: 'peng', tiles: [tile, tile, tile] });
        player.sortHand();
        this.currentPlayer = player.id;
        this.pending = null;
        this.render();
        this.speak('碰');
        this.showToast(`${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} 碰！`);
        if (player.isHuman) {
            this.enableDiscard = true;
            document.getElementById('hint-text').textContent = '碰了！请点击手牌出牌';
        } else {
            this.schedule(() => {
                const idx = AIPlayer.chooseDiscard(player, this.aiOpts(), this);
                this.doDiscard(player, idx);
            }, 800);
        }
    }

    // 吃（仅吃上家打出的牌）
    doChi(player, tile, fromId, combo) {
        if (player.isKnocked) return; // 报听者手牌锁定，不得吃
        for (const t of combo) player.removeTile(t);
        this.players[fromId].discards.pop();
        const tiles = [...combo, tile];
        tiles.sort((a, b) => a.value - b.value);
        player.melds.push({ type: 'chi', tiles });
        player.sortHand();
        this.currentPlayer = player.id;
        this.pending = null;
        this.render();
        this.speak('吃');
        this.showToast(`${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} 吃！`);
        if (player.isHuman) {
            this.enableDiscard = true;
            document.getElementById('hint-text').textContent = '吃了！请点击手牌出牌';
        } else {
            this.schedule(() => {
                const idx = AIPlayer.chooseDiscard(player, this.aiOpts(), this);
                this.doDiscard(player, idx);
            }, 800);
        }
    }

    doMingGang(player, tile, fromId) {
        let removed = 0;
        player.hand = player.hand.filter(t => {
            if (removed < 3 && t.suit === tile.suit && t.value === tile.value) { removed++; return false; }
            return true;
        });
        this.players[fromId].discards.pop();
        player.melds.push({ type: 'gang', tiles: [tile, tile, tile, tile] });
        // 杠不单独结算、不向任何人收钱；价值只体现在"花"里（已杠出每次 2 花）
        player.gangCounts.ming++;
        player.sortHand();
        this.currentPlayer = player.id;
        this.pending = null;
        this._drawFromBack = true; // 杠后从牌堆末尾摸牌
        this.render();
        this.speak('杠');
        this.showToast(`${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} 明杠！`);
        this.schedule(() => this.gameLoop(), 800);
    }

    doAnGang(player, tile) {
        player.hand = player.hand.filter(t => !(t.suit === tile.suit && t.value === tile.value));
        player.melds.push({ type: 'angang', tiles: [tile, tile, tile, tile] });
        // 杠不单独结算、不向任何人收钱；价值只体现在"花"里（已杠出每次 2 花）
        player.gangCounts.an++;
        player.sortHand();
        this.currentPlayer = player.id;
        this.pending = null;
        this._drawFromBack = true;
        this.render();
        this.speak('杠');
        this.showToast(`${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} 暗杠！`);
        this.schedule(() => this.gameLoop(), 800);
    }

    doBuGang(player, tile) {
        const meld = player.melds.find(m => m.type === 'peng' && m.tiles[0].suit === tile.suit && m.tiles[0].value === tile.value);
        if (!meld) return;
        // 抢杠胡：任一已敲且有番的玩家可胡该牌，则取消补杠
        const robber = this.players.find(p => p.id !== player.id && !p.isHu && p.isKnocked
            && HuChecker.canRon(p, tile, { qiangGang: true }));
        if (robber) {
            this.lastDiscardFrom = player.id;
            player.removeTile(tile);
            this.doHu(robber, tile, false, { qiangGang: true });
            return;
        }
        meld.type = 'bugang';
        meld.tiles.push(tile);
        player.removeTile(tile);
        // 杠不单独结算、不向任何人收钱；价值只体现在"花"里（已杠出每次 2 花）
        player.gangCounts.bu++;
        player.sortHand();
        this.currentPlayer = player.id;
        this.pending = null;
        this._drawFromBack = true;
        this.render();
        this.speak('杠');
        this.showToast(`${player.isHuman ? '你' : 'AI·' + this.seatName(player.id)} 补杠！`);
        this.schedule(() => this.gameLoop(), 800);
    }

    checkAnGang(player) {
        const counts = {};
        for (const t of player.hand) {
            counts[t.id] = (counts[t.id] || 0) + 1;
        }
        for (const [id, count] of Object.entries(counts)) {
            if (count === 4) {
                const [suit, val] = id.split('_');
                return new Tile(suit, parseInt(val));
            }
        }
        return null;
    }

    checkBuGang(player) {
        for (const meld of player.melds) {
            if (meld.type === 'peng') {
                const t = meld.tiles[0];
                if (player.hand.some(h => h.suit === t.suit && h.value === t.value)) {
                    return t;
                }
            }
        }
        return null;
    }

    nextTurn() {
        this.nextPlayer();
        this.gameLoop();
    }

    nextPlayer() {
        let next = (this.currentPlayer + 1) % 4;
        let count = 0;
        while (this.players[next].isHu && count < 4) { next = (next + 1) % 4; count++; }
        this.currentPlayer = next;
    }

    // ==================== 流局 ====================
    liuJu() {
        this.phase = 'end';
        // 查叫：听牌者收未听者的分（无花猪概念；已胡者退出、不参与）
        for (const p of this.players) {
            if (p.isHu) continue;
            p.tingFan = this.tingMaxFan(p);
            p.isTing = p.tingFan > 0;
        }
        const cap = this.maxFan || Infinity;
        for (const p of this.players) {
            if (p.isHu || p.isTing) continue;
            for (const t of this.players) {
                if (t.isHu || !t.isTing || t === p) continue;
                // 基数(底分 + 该家有效花) × 叫番
                const pay = ((this.baseScore || 2) + HuChecker.effFlower(t)) * Math.min(t.tingFan, cap);
                p.score -= pay;
                t.score += pay;
            }
        }
        this.showResultModal('🀄 流局：未听牌者赔给听牌者（底分 + 花） × 叫番');
    }

    checkTing(player) {
        return HuChecker.tingTiles(player.hand, player.melds).length > 0;
    }

    tingMaxFan(player) {
        let best = 0;
        const savedHand = player.hand;
        for (const id of HuChecker.tingTiles(player.hand, player.melds)) {
            const [suit, v] = id.split('_');
            const testTile = new Tile(suit, parseInt(v));
            player.hand = [...savedHand, testTile];
            const info = HuChecker.calcFan(player, testTile, false, {});
            if (info.fan > best) best = info.fan;
        }
        player.hand = savedHand;
        return best;
    }

    endGame() {
        this.phase = 'end';
        for (const p of this.players) {
            if (p.isHu) continue;
            p.tingFan = this.tingMaxFan(p);
            p.isTing = p.tingFan > 0;
        }
        this.showResultModal('');
    }

    showResultModal(extraMsg) {
        let rows = '';
        for (const p of this.players) {
            const name = p.isHuman ? '你' : 'AI·' + ['','东','北','西'][p.id];
            let status = '';
            if (p.isHu) {
                status = '✅ 胡牌';
            } else if (p.isKnocked) {
                status = '🔔 已报听';
            } else if (p.isTing) {
                status = '👂 听牌';
            } else {
                status = '❌ 未听';
            }
            const scoreClass = p.score >= 0 ? 'positive' : 'negative';
            const rowClass = p.isHu ? 'winner' : '';

            let detail = '';
            if (p.isHu && p.huInfo) {
                const hi = p.huInfo;
                const fromName = hi.isZiMo ? '' : (this.players[hi.fromId] ? (this.players[hi.fromId].isHuman ? '你' : 'AI·' + ['','东','北','西'][hi.fromId]) : '');
                const huWay = hi.isZiMo ? '自摸' : (hi.isQiangGang ? '抢杠胡' : ('点炮 · 来源: ' + fromName));
                const tileName = hi.tile ? hi.tile.toString() : '';
                const bp = hi.basePoint || 2;
                const fl = hi.flower || 0;
                const base = hi.base || (bp + fl);
                const pay = hi.pay || (base * hi.fan);
                detail += `<div class="result-detail">${huWay} ｜ 胡牌: ${tileName} ｜ 底分${bp}+花${fl}=基数${base} × ${hi.fan}番 = ${pay}分 (${hi.fanList.join('+')})</div>`;
            }
            if (p.flowers && p.flowers.length) {
                detail += `<div class="result-detail">花 ${p.flowers.map(f => f.toString()).join('')} (${p.flowers.length}花)</div>`;
            }

            rows += `<div class="result-row ${rowClass}">
                <span><span>${name} ${status}</span><span class="score ${scoreClass}">${p.score >= 0 ? '+' : ''}${p.score}</span></span>
                ${detail}
            </div>`;
        }

        // 记录本局历史（每局仅记一次，避免重复计局）
        if (!this._resultSaved) {
            this._resultSaved = true;
            const details = this.players.map(p => {
                const status = p.isHu ? 'hu' : (p.isTing ? 'ting' : 'none');
                return {
                    score: p.score,
                    status,
                    tingFan: p.tingFan || 0,
                    hu: p.huInfo ? {
                        isZiMo: p.huInfo.isZiMo,
                        isQiangGang: p.huInfo.isQiangGang,
                        fromId: p.huInfo.fromId,
                        fanList: p.huInfo.fanList,
                        fan: p.huInfo.fan,
                        basePoint: p.huInfo.basePoint || 2,
                        flower: p.huInfo.flower || 0,
                        base: p.huInfo.base || 1,
                        pay: p.huInfo.pay || p.huInfo.fan
                    } : null,
                    gang: { ming: p.gangCounts.ming, an: p.gangCounts.an, bu: p.gangCounts.bu, score: p.gangScore }
                };
            });
            this.history.push({ t: new Date().toISOString(), scores: this.players.map(p => p.score), details });
            this.saveHistory();
            this.totalScore += this.players[0].score;
        }
        document.getElementById('total-score').textContent = this.totalScore;

        const html = `
            <div class="modal-overlay">
                <div class="modal lb-modal">
                    <h2>📊 本局结算</h2>
                    ${extraMsg ? `<p>${extraMsg}</p>` : ''}
                    <div class="result-panel">${rows}</div>
                    <p style="font-size:12px;color:#999;">你的累计总分: ${this.totalScore}</p>
                    <button class="modal-btn primary" onclick="game.backToTable()">✅ 确认结果</button>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
    }

    // 从面板输入读取并保存设置
    applySettingsFromInputs() {
        const fanVal = document.getElementById('fan-cap-input').value;
        const f = (fanVal === '' || fanVal === null) ? null : parseInt(fanVal, 10);
        this.maxFan = (f === null || isNaN(f) || f < 1) ? null : f;
        const sp = document.getElementById('ai-speed-input').value;
        if (['slow', 'normal', 'fast', 'lightning'].includes(sp)) this.aiSpeed = sp;
        const lvl = document.getElementById('ai-level-input').value;
        if (['easy', 'normal', 'hard', 'master'].includes(lvl)) this.aiLevel = lvl;
        const bs = parseInt(document.getElementById('base-score-input').value, 10);
        this.baseScore = (isNaN(bs) || bs < 1) ? 2 : bs;
        const bbEl = document.getElementById('bloodbattle-input');
        if (bbEl) this.bloodBattle = !!bbEl.checked;
        try {
            localStorage.setItem('qiaoma_ailevel', this.aiLevel);
            localStorage.setItem('qiaoma_bloodbattle', this.bloodBattle ? '1' : '0');
        } catch (e) { /* 忽略 */ }
        this.updateGameTitle();
    }

    // 左上角标题牌文案：随「胡到底（血战到底）」开关切换
    updateGameTitle() {
        const el = document.getElementById('game-title');
        if (!el) return;
        el.textContent = this.bloodBattle ? '上海麻将（敲麻）· 胡到底' : '上海麻将（敲麻）';
    }

    // 积分榜 + 历史对局弹窗
    showLeaderboard() {
        const names = ['你', 'AI·东', 'AI·北', 'AI·西'];
        const colors = ['#e6a23c', '#409eff', '#67c23a', '#f56c6c'];
        // 累计总分（按牌桌座位展示）
        const totals = [0, 0, 0, 0];
        this.history.forEach(r => r.scores.forEach((s, i) => { totals[i] += s; }));

        const seatBox = (label, total, isMe, col) => {
            const cls = total >= 0 ? 'positive' : 'negative';
            return `<div class="seat${isMe ? ' me' : ''}" style="grid-column:${col};">
                <div class="seat-name">${label}</div>
                <div class="seat-score score ${cls}">${total >= 0 ? '+' : ''}${total}</div>
            </div>`;
        };
        let boardRows;
        if (!this.history.length) {
            boardRows = `<div class="table-empty">暂无对局记录</div>`;
        } else {
            boardRows = `
                <div class="table-seats">
                    ${seatBox('西家', totals[3], false, 1)}
                    ${seatBox('北家', totals[2], false, 2)}
                    ${seatBox('东家', totals[1], false, 3)}
                    ${seatBox('你', totals[0], true, 2)}
                </div>`;
        }

        // 历史对局（倒序）
        let histRows = '';
        if (this.history.length === 0) {
            histRows = `<div class="result-row"><span>暂无历史对局</span></div>`;
        } else {
            for (let i = this.history.length - 1; i >= 0; i--) {
                const rec = this.history[i];
                const dt = new Date(rec.t).toLocaleString('zh-CN');
                const myScore = rec.scores[0];
                const myCls = myScore >= 0 ? 'positive' : 'negative';
                const detailId = `hist-detail-${i}`;
                let detail = '';
                const hasDetails = rec.details && rec.details.length === 4;
                const statusText = { hu: '✅ 胡牌', ting: '👂 听牌', none: '❌ 未听' };
                const head = `<div class="hd hd-head">名字</div><div class="hd hd-head">分数</div><div class="hd hd-head">胡状态</div><div class="hd hd-head">杠状态</div>`;
                const buildRow = (name, score, huHtml, gangHtml) => {
                    const dcls = score >= 0 ? 'positive' : 'negative';
                    return `<div class="hd">${name}</div>` +
                        `<div class="hd score ${dcls}">${score >= 0 ? '+' : ''}${score}</div>` +
                        `<div class="hd">${huHtml}</div>` +
                        `<div class="hd">${gangHtml}</div>`;
                };
                if (hasDetails) {
                    let body = '';
                    rec.details.forEach((d, j) => {
                        let huHtml = '';
                        if (d.hu) {
                            const hi = d.hu;
                            const fromName = hi.isZiMo ? '' : (this.players[hi.fromId] ? (this.players[hi.fromId].isHuman ? '你' : 'AI·' + ['', '东', '北', '西'][hi.fromId]) : '');
                            const huWay = hi.isZiMo ? '自摸' : (hi.isQiangGang ? '抢杠胡' : ('点炮·' + fromName));
                            const bp = hi.basePoint || 2;
                            const fl = hi.flower || 0;
                            const base = hi.base || (bp + fl);
                            const pay = hi.pay || (base * hi.fan);
                            huHtml = `${huWay} 底${bp}+花${fl}=基数${base}×${hi.fan}番=${pay}分`;
                        } else {
                            let st = statusText[d.status] || '';
                            if (d.status === 'ting' && d.tingFan) st += ` · ${d.tingFan}番`;
                            huHtml = st;
                        }
                        let gangHtml = '';
                        if (d.gang && d.gang.score > 0) {
                            const g = d.gang;
                            gangHtml = `明×${g.ming} 暗×${g.an} 补×${g.bu} (+${g.score})`;
                        }
                        body += buildRow(names[j], d.score, huHtml, gangHtml);
                    });
                    detail = `<div class="hist-table">${head}${body}</div>`;
                } else {
                    let body = '';
                    rec.scores.forEach((s, j) => {
                        body += buildRow(names[j], s, '', '');
                    });
                    detail = `<div class="hist-table">${head}${body}</div>`;
                }
                histRows += `
                    <div class="hist-item">
                        <div class="hist-head" onclick="game.toggleHistoryDetail('${detailId}')">
                            <span class="hist-round">第${i + 1}局</span>
                            <span>📅 ${dt}</span>
                            <span class="score ${myCls}">你 ${myScore >= 0 ? '+' : ''}${myScore} ▾</span>
                        </div>
                        <div class="hist-detail" id="${detailId}" style="display:none;">${detail}</div>
                    </div>`;
            }
        }

        const html = `
            <div class="modal-overlay" onclick="if(event.target===this)document.getElementById('modal-container').innerHTML='';">
                <div class="modal lb-modal">
                    <h2>📈 积分榜</h2>
                    <div class="lb-section-title">累计总分（按方位）</div>
                    <div class="result-panel">${boardRows}</div>
                    <div class="lb-section-title lb-collapsible" onclick="game.toggleLeaderboardSection('lb-chart-body')">积分走势（累计）<span class="lb-arrow" id="lb-chart-arrow">▸</span></div>
                    <div class="lb-chart-wrap" id="lb-chart-body" style="display:none;">
                        ${this.history.length
                            ? `<canvas id="score-chart"></canvas>
                               <div class="lb-legend">${names.map((n, i) => `<span class="lg-item"><i style="background:${colors[i]}"></i>${n}</span>`).join('')}</div>`
                            : '<div class="table-empty">暂无对局数据</div>'}
                    </div>
                    <div class="lb-section-title">历史对局（点击展开明细）</div>
                    <div class="result-panel hist-list">${histRows}</div>
                    <div class="lb-actions">
                        <button class="modal-btn danger" onclick="game.clearHistory()">清空记录</button>
                        <button class="modal-btn" onclick="document.getElementById('modal-container').innerHTML='';">关闭</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('modal-container').innerHTML = html;
        this.drawScoreChart();
    }

    // 积分走势折线图：四位玩家累计积分随局数变化（原生 canvas，无依赖）
    drawScoreChart() {
        const canvas = document.getElementById('score-chart');
        if (!canvas) return; // 无对局数据时 canvas 不注入，直接返回
        const wrap = canvas.parentElement;
        if (wrap && wrap.style.display === 'none') return; // 折叠时跳过绘制，展开时再画（避免隐藏态 clientWidth=0 出空白）
        const ctx = canvas.getContext('2d');
        const colors = ['#e6a23c', '#409eff', '#67c23a', '#f56c6c'];
        const hist = this.history;
        const N = hist.length;
        if (!N) return;

        // 累计积分序列：cum[k] 为第 k 局结束后的累计分（k=0 为开局基准全 0）
        const cum = [[0, 0, 0, 0]];
        for (let k = 0; k < N; k++) {
            const prev = cum[k];
            const s = hist[k].scores || [0, 0, 0, 0];
            cum.push([0, 1, 2, 3].map(i => prev[i] + (s[i] || 0)));
        }

        let yMin = 0, yMax = 0;
        for (let k = 0; k <= N; k++)
            for (let i = 0; i < 4; i++) {
                yMin = Math.min(yMin, cum[k][i]);
                yMax = Math.max(yMax, cum[k][i]);
            }
        const pad = (yMax - yMin) * 0.1 || 10;
        yMin -= pad; yMax += pad;

        // 画布尺寸（dpr 适配，避免高清屏模糊）
        const cssW = wrap.clientWidth || 680;
        const cssH = 220;
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = cssW + 'px';
        canvas.style.height = cssH + 'px';
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, cssW, cssH);

        const padL = 44, padR = 14, padT = 12, padB = 26;
        const plotW = cssW - padL - padR;
        const plotH = cssH - padT - padB;
        // X 轴域向上取到最近的 10 的整数倍（如 27→30、45→50），让末局数据不贴边
        const Nx = Math.ceil(N / 10) * 10;
        const xAt = (k) => padL + plotW * k / Nx;
        const yAt = (v) => padT + plotH * (yMax - v) / (yMax - yMin);

        // 绘图区白底
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(padL, padT, plotW, plotH);

        // 横向网格 + Y 轴刻度
        ctx.lineWidth = 1;
        ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        const ticks = 5;
        for (let t = 0; t <= ticks; t++) {
            const val = yMin + (yMax - yMin) * t / ticks;
            const y = yAt(val);
            ctx.strokeStyle = '#ececec';
            ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
            ctx.fillStyle = '#999';
            ctx.fillText(String(Math.round(val)), padL - 6, y);
        }
        // 0 基准线加粗
        if (yMin < 0 && yMax > 0) {
            const y0 = yAt(0);
            ctx.strokeStyle = '#bbb';
            ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(padL, y0); ctx.lineTo(padL + plotW, y0); ctx.stroke();
        }

        // X 轴局号标签：按整 10 均匀分布（0 记为“开局”），末位为向上取整的 10 的倍数 Nx
        ctx.fillStyle = '#999';
        ctx.textBaseline = 'top';
        for (let k = 0; k <= Nx; k += 10) {
            if (k === 0) {
                ctx.textAlign = 'left';
                ctx.fillText('开局', padL, padT + plotH + 6);
            } else if (k === Nx) {
                ctx.textAlign = 'right';
                ctx.fillText(String(k), padL + plotW, padT + plotH + 6);
            } else {
                ctx.textAlign = 'center';
                ctx.fillText(String(k), xAt(k), padT + plotH + 6);
            }
        }

        // 四条折线 + 数据点
        for (let i = 0; i < 4; i++) {
            ctx.strokeStyle = colors[i];
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let k = 0; k <= N; k++) {
                const x = xAt(k), y = yAt(cum[k][i]);
                if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.fillStyle = colors[i];
            for (let k = 0; k <= N; k++) {
                const x = xAt(k), y = yAt(cum[k][i]);
                ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2); ctx.fill();
            }
        }
    }

    toggleHistoryDetail(id) {
        const el = document.getElementById(id);
        if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    // 积分榜分区折叠（走势图默认收起，展开时再绘制折线图）
    toggleLeaderboardSection(id) {
        const el = document.getElementById(id);
        if (!el) return;
        const hidden = el.style.display === 'none' || el.style.display === '';
        el.style.display = hidden ? 'block' : 'none';
        const arrow = document.getElementById('lb-chart-arrow');
        if (arrow) arrow.textContent = hidden ? '▾' : '▸';
        if (hidden && id === 'lb-chart-body') this.drawScoreChart();
    }

    clearHistory() {
        if (!confirm('确定清空所有历史对局记录吗？此操作不可恢复。')) return;
        this.history = [];
        this.totalScore = 0;
        this.saveHistory();
        document.getElementById('total-score').textContent = '0';
        this.showLeaderboard();
    }

    // ==================== 渲染 ====================
    render() {
        this.renderAllHands();
        this.renderAllDiscards();
        this.renderAllMelds();
        this.renderAllFlowers();
        this.renderInfo();
        this.renderLastDiscard();
        document.getElementById('wall-count').textContent = this.wall.length;
        this.updateKnockStatus();
    }

    renderLastDiscard() {
        const el = document.getElementById('last-discard');
        if (!el) return;
        if (!this.lastDiscard) { el.innerHTML = ''; return; }
        const names = ['你', 'AI·东', 'AI·北', 'AI·西'];
        const fromName = names[this.lastDiscardFrom] || '';
        el.innerHTML = `<div class="ld-label">${fromName} 打出</div>`;
        const tileEl = this.createTileElement(this.lastDiscard, -1);
        tileEl.classList.add('ld-tile');
        el.appendChild(tileEl);
    }

    renderAllHands() {
        for (let i = 0; i < 4; i++) {
            const container = document.getElementById(`hand-${i}`);
            container.innerHTML = '';
            const player = this.players[i];

            if (i === 0) {
                // 人类玩家：显示正面
                let huMarked = false;
                player.hand.forEach((tile, idx) => {
                    const el = this.createTileElement(tile, idx);
                    el.onclick = () => this.onTileClick(idx);
                    if (idx === this.selectedIndex) el.classList.add('selected'); // 保持已抬高的牌
                    // 摸牌提示（仅人类回合）
                    if (this.currentPlayer === 0 && this.phase === 'play' && this.drawnTile && tile === this.drawnTile) {
                        el.classList.add('drawn-tile');
                    }
                    // 胡牌后标出那张胡的牌（人类手牌本就正面可见；同种牌只标一张）
                    if (player.isHu && player.huInfo && player.huInfo.tile && !huMarked
                        && tile.suit === player.huInfo.tile.suit && tile.value === player.huInfo.tile.value) {
                        el.classList.add('hu-win-tile');
                        huMarked = true;
                    }
                    container.appendChild(el);
                });
            } else {
                // AI：仅牌局结束时整手翻开；血战中已胡者保持背面，只在下方单独亮出胡牌张
                if (this.phase === 'end') {
                    let huMarked = false;
                    player.hand.forEach((tile) => {
                        const el = this.createTileElement(tile, -1);
                        el.style.cursor = 'default';
                        if (player.isHu && player.huInfo && player.huInfo.tile && !huMarked
                            && tile.suit === player.huInfo.tile.suit && tile.value === player.huInfo.tile.value) {
                            el.classList.add('hu-win-tile');
                            huMarked = true;
                        }
                        container.appendChild(el);
                    });
                } else {
                    for (let j = 0; j < player.hand.length; j++) {
                        const back = document.createElement('div');
                        back.className = 'tile-back';
                        container.appendChild(back);
                    }
                    // AI 胡牌后：在背面手牌之外高亮展示最后一张胡的牌（自摸/点炮/抢杠均适用）
                    if (player.isHu && player.huInfo && player.huInfo.tile) {
                        const huEl = this.createTileElement(player.huInfo.tile, -1);
                        huEl.classList.add('hu-win-tile');
                        container.appendChild(huEl);
                    }
                }
            }
        }
    }

    renderAllDiscards() {
        for (let i = 0; i < 4; i++) {
            const container = document.getElementById(`discard-${i}`);
            container.innerHTML = '';
            for (const tile of this.players[i].discards) {
                const el = this.createTileElement(tile, -1);
                el.style.cursor = 'default';
                container.appendChild(el);
            }
        }
    }

    renderAllMelds() {
        for (let i = 0; i < 4; i++) {
            const container = document.getElementById(`meld-${i}`);
            container.innerHTML = '';
            for (const meld of this.players[i].melds) {
                const group = document.createElement('div');
                group.className = 'meld-group';
                const showCount = meld.type === 'angang' ? 4 : meld.tiles.length;
                for (let j = 0; j < showCount; j++) {
                    if (meld.type === 'angang' && j > 0 && j < 3) {
                        // 暗杠中间两张显示背面
                        const back = document.createElement('div');
                        back.className = 'tile-back';
                        back.style.width = '30px';
                        back.style.height = '42px';
                        group.appendChild(back);
                    } else {
                        const el = this.createTileElement(meld.tiles[j], -1);
                        el.style.cursor = 'default';
                        group.appendChild(el);
                    }
                }
                container.appendChild(group);
            }
        }
    }

    // 花牌独立展示区（与吃碰杠副露区分开，全场公开）
    renderAllFlowers() {
        for (let i = 0; i < 4; i++) {
            const container = document.getElementById(`flower-${i}`);
            if (!container) continue;
            container.innerHTML = '';
            for (const tile of this.players[i].flowers) {
                const el = this.createTileElement(tile, -1);
                el.style.cursor = 'default';
                container.appendChild(el);
            }
        }
    }

    renderInfo() {
        for (let i = 0; i < 4; i++) {
            const info = document.getElementById(`info-${i}`);
            const p = this.players[i];
            const name = i === 0 ? '你' : 'AI·' + ['','东','北','西'][i];
            const knockText = p.isKnocked ? '<span class="knock-badge">敲</span>' : '';
            const flowerText = (p.flowers && p.flowers.length) ? `<span class="flower-info">花${p.flowers.length}</span>` : '';
            let huText = '';
            if (p.isHu && p.huInfo) {
                const fan = p.huInfo.fan;
                if (p.huInfo.isZiMo) {
                    huText = ` 🎉自摸·${fan}番`;
                } else if (p.huInfo.isQiangGang) {
                    huText = ` 🎉抢杠·${fan}番`;
                } else {
                    const fromName = p.huInfo.fromId === 0 ? '你' : 'AI·' + ['', '东', '北', '西'][p.huInfo.fromId];
                    huText = ` 🎉点炮·${fromName}·${fan}番`;
                }
            }
            const dealerText = (i === this.dealerId) ? ' <span class="dealer-badge">庄</span>' : '';
            info.innerHTML = `${name}${dealerText}${knockText} ${flowerText}${huText} [${p.score}]`;
            info.className = 'player-info' + (this.currentPlayer === i && this.phase === 'play' ? ' active' : '');
        }
    }

    createTileElement(tile, idx) {
        const el = document.createElement('div');
        el.className = `tile ${tile.suit}`;
        el.innerHTML = tileSVG(tile);
        return el;
    }

    showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.display = 'block';
        toast.style.animation = 'none';
        toast.offsetHeight; // reflow
        toast.style.animation = 'fadeInOut 2s ease-in-out';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // 牌样预览：双击左上角总分弹出，展示全部 144 张牌面，便于调整样式
    showTileGallery() {
        let sections = '';
        // 序数牌
        for (const suit of SUITS) {
            let tiles = '';
            for (let v = 1; v <= 9; v++) {
                tiles += `<div class="tile ${suit}" title="${v}${SUIT_NAMES[suit]}">${tileSVG(new Tile(suit, v))}</div>`;
            }
            sections += `<div class="gallery-section"><h3>${SUIT_NAMES[suit]}子（1~9）</h3><div class="gallery-row">${tiles}</div></div>`;
        }
        // 字牌
        let honorTiles = '';
        for (let v = 1; v <= 4; v++) {
            honorTiles += `<div class="tile feng" title="${HONOR_NAMES[v]}">${tileSVG(new Tile(HONOR_SUIT, v))}</div>`;
        }
        sections += `<div class="gallery-section"><h3>字牌（东南西北）</h3><div class="gallery-row">${honorTiles}</div></div>`;
        // 花牌
        let flowerTiles = '';
        for (let v = 1; v <= 11; v++) {
            flowerTiles += `<div class="tile flower" title="${FLOWER_NAMES[v]}">${tileSVG(new Tile(FLOWER_SUIT, v))}</div>`;
        }
        sections += `<div class="gallery-section"><h3>花牌（春夏秋冬 · 梅兰竹菊 · 中发白）</h3><div class="gallery-row">${flowerTiles}</div></div>`;

        const html = `
            <div class="modal-overlay" id="tile-gallery-modal" onclick="if(event.target===this)document.getElementById('modal-container').innerHTML='';">
                <div class="modal" style="max-width:760px;">
                    <h2>🀄 麻将牌样式预览（144 张）</h2>
                    <p style="font-size:13px;color:#999;">双击左上角总分可再次打开 · 点击空白处关闭</p>
                    <div class="gallery">${sections}</div>
                    <div class="lb-actions">
                        <button class="modal-btn" onclick="document.getElementById('modal-container').innerHTML='';">关闭</button>
                    </div>
                </div>
            </div>`;
        document.getElementById('modal-container').innerHTML = html;
    }
}

// ==================== 启动游戏 ====================
let game;
window.onload = () => {
    game = new MahjongGame();
};
</script>
